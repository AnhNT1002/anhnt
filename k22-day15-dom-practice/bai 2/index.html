<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PASSWORD</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen flex items-center justify-center transition-all duration-300 bg-gray-100">
    <div class="w-96 p-6 border rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-3">Đăng nhập</h1>
        <label for="password" class="block mb-2 font-medium">Mật khẩu</label>
        <div class="flex gap-2">
            <input type="password" id="password" placeholder="Nhập mật khẩu" class="flex-1 min-w-0 border border-gray-300 px-3 py-2 rounded-lg outline-none focus:border-[#0074BC]">
            <button id="showBtn" class="bg-[#0074bc] hover:bg-[#005f99] text-white px-4 rounded-lg cursor-pointer font-bold">Hiện</button>
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
